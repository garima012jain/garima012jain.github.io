<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c770f0;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#6d20c5;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="180" fill="url(#bg)" stroke="#c770f0" stroke-width="2" opacity="0.5"/>
  <!-- Person silhouette -->
  <circle cx="200" cy="140" r="50" fill="#c770f0" opacity="0.6"/>
  <ellipse cx="200" cy="280" rx="80" ry="60" fill="#c770f0" opacity="0.4"/>
  <!-- Code symbols floating -->
  <text x="80" y="100" fill="#be6adf" font-family="monospace" font-size="20" opacity="0.6">{ }</text>
  <text x="290" y="120" fill="#be6adf" font-family="monospace" font-size="18" opacity="0.5">/&gt;</text>
  <text x="70" y="280" fill="#8a49a8" font-family="monospace" font-size="16" opacity="0.4">( )</text>
  <text x="300" y="270" fill="#8a49a8" font-family="monospace" font-size="16" opacity="0.4">[ ]</text>
</svg>
