<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c770f0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6d20c5;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <!-- Monitor -->
  <rect x="120" y="80" width="260" height="180" rx="10" fill="#1b1a2e" stroke="url(#grad1)" stroke-width="3"/>
  <rect x="135" y="95" width="230" height="150" rx="5" fill="#0c0513"/>
  <!-- Code lines -->
  <rect x="150" y="110" width="80" height="6" rx="3" fill="#c770f0" opacity="0.8"/>
  <rect x="150" y="125" width="120" height="6" rx="3" fill="#be6adf" opacity="0.5"/>
  <rect x="165" y="140" width="100" height="6" rx="3" fill="#8a49a8" opacity="0.6"/>
  <rect x="165" y="155" width="140" height="6" rx="3" fill="#c770f0" opacity="0.4"/>
  <rect x="150" y="170" width="90" height="6" rx="3" fill="#be6adf" opacity="0.7"/>
  <rect x="165" y="185" width="110" height="6" rx="3" fill="#8a49a8" opacity="0.5"/>
  <rect x="150" y="200" width="70" height="6" rx="3" fill="#c770f0" opacity="0.6"/>
  <rect x="150" y="215" width="130" height="6" rx="3" fill="#be6adf" opacity="0.4"/>
  <!-- Monitor stand -->
  <rect x="220" y="260" width="60" height="15" fill="#1b1a2e"/>
  <rect x="200" y="275" width="100" height="8" rx="4" fill="#1b1a2e" stroke="url(#grad1)" stroke-width="1.5"/>
  <!-- Floating elements -->
  <circle cx="380" cy="120" r="15" fill="none" stroke="#c770f0" stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="180" r="10" fill="none" stroke="#be6adf" stroke-width="2" opacity="0.4"/>
  <rect x="370" y="200" width="20" height="20" rx="3" fill="none" stroke="#8a49a8" stroke-width="2" opacity="0.5" transform="rotate(15 380 210)"/>
  <!-- Gear icon -->
  <circle cx="400" cy="300" r="18" fill="none" stroke="#c770f0" stroke-width="2" opacity="0.4"/>
  <circle cx="400" cy="300" r="8" fill="none" stroke="#c770f0" stroke-width="2" opacity="0.4"/>
  <!-- Cloud -->
  <ellipse cx="130" cy="320" rx="30" ry="15" fill="none" stroke="#be6adf" stroke-width="1.5" opacity="0.3"/>
  <!-- Terminal bracket -->
  <text x="90" y="130" fill="#c770f0" font-family="monospace" font-size="24" opacity="0.4">&gt;_</text>
  <!-- Database icon -->
  <ellipse cx="410" cy="170" rx="15" ry="8" fill="none" stroke="#be6adf" stroke-width="1.5" opacity="0.4"/>
  <line x1="395" y1="170" x2="395" y2="195" stroke="#be6adf" stroke-width="1.5" opacity="0.4"/>
  <line x1="425" y1="170" x2="425" y2="195" stroke="#be6adf" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="410" cy="195" rx="15" ry="8" fill="none" stroke="#be6adf" stroke-width="1.5" opacity="0.4"/>
</svg>
