<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c770f0;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#6d20c5;stop-opacity:0.7"/>
    </linearGradient>
  </defs>
  <!-- Laptop body -->
  <rect x="100" y="100" width="300" height="200" rx="10" fill="#1b1a2e" stroke="url(#laptopGrad)" stroke-width="3"/>
  <!-- Screen -->
  <rect x="115" y="115" width="270" height="170" rx="5" fill="#0c0513"/>
  <!-- Code on screen -->
  <rect x="130" y="130" width="60" height="5" rx="2.5" fill="#c770f0" opacity="0.8"/>
  <rect x="130" y="142" width="100" height="5" rx="2.5" fill="#be6adf" opacity="0.5"/>
  <rect x="145" y="154" width="80" height="5" rx="2.5" fill="#8a49a8" opacity="0.6"/>
  <rect x="145" y="166" width="120" height="5" rx="2.5" fill="#c770f0" opacity="0.4"/>
  <rect x="130" y="178" width="70" height="5" rx="2.5" fill="#be6adf" opacity="0.7"/>
  <rect x="145" y="190" width="90" height="5" rx="2.5" fill="#8a49a8" opacity="0.5"/>
  <rect x="130" y="202" width="110" height="5" rx="2.5" fill="#c770f0" opacity="0.6"/>
  <rect x="145" y="214" width="60" height="5" rx="2.5" fill="#be6adf" opacity="0.4"/>
  <rect x="130" y="226" width="85" height="5" rx="2.5" fill="#8a49a8" opacity="0.6"/>
  <rect x="130" y="238" width="50" height="5" rx="2.5" fill="#c770f0" opacity="0.5"/>
  <!-- Terminal cursor -->
  <rect x="130" y="254" width="8" height="12" fill="#c770f0" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Laptop base -->
  <path d="M80 300 L100 300 L115 320 L385 320 L400 300 L420 300 L400 340 L100 340 Z" fill="#1b1a2e" stroke="url(#laptopGrad)" stroke-width="2"/>
  <!-- Coffee cup -->
  <rect x="420" y="280" width="30" height="40" rx="3" fill="none" stroke="#be6adf" stroke-width="2" opacity="0.5"/>
  <path d="M450 290 Q465 295 450 310" fill="none" stroke="#be6adf" stroke-width="2" opacity="0.5"/>
  <!-- Steam -->
  <path d="M430 270 Q433 260 430 250" fill="none" stroke="#be6adf" stroke-width="1.5" opacity="0.3"/>
  <path d="M440 268 Q443 258 440 248" fill="none" stroke="#be6adf" stroke-width="1.5" opacity="0.3"/>
</svg>
