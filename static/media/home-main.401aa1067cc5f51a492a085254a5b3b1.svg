<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c4a8"/>
      <stop offset="100%" style="stop-color:#e6a882"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1810"/>
      <stop offset="100%" style="stop-color:#1a0e08"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c770f0"/>
      <stop offset="100%" style="stop-color:#8a3cb8"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1950"/>
      <stop offset="100%" style="stop-color:#1b1035"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e3f"/>
      <stop offset="100%" style="stop-color:#0d0d2b"/>
    </linearGradient>
    <linearGradient id="chairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d2066"/>
      <stop offset="100%" style="stop-color:#2a1548"/>
    </linearGradient>
    <linearGradient id="plantGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9e6e"/>
      <stop offset="100%" style="stop-color:#6dc98e"/>
    </linearGradient>
  </defs>

  <!-- Floor shadow -->
  <ellipse cx="300" cy="470" rx="250" ry="15" fill="#1a0e25" opacity="0.4"/>

  <!-- Desk -->
  <rect x="140" y="310" width="340" height="12" rx="3" fill="url(#deskGrad)" stroke="#c770f0" stroke-width="0.5" opacity="0.9"/>
  <!-- Desk legs -->
  <rect x="160" y="322" width="8" height="130" fill="#2d1950" opacity="0.8"/>
  <rect x="452" y="322" width="8" height="130" fill="#2d1950" opacity="0.8"/>
  <!-- Desk shelf -->
  <rect x="160" y="390" width="300" height="6" rx="2" fill="#2d1950" opacity="0.5"/>

  <!-- Chair back -->
  <path d="M310 230 Q270 220 260 280 L260 360 Q280 370 330 370 L330 280 Q340 220 310 230Z" fill="url(#chairGrad)" opacity="0.9"/>
  <!-- Chair seat -->
  <ellipse cx="295" cy="365" rx="45" ry="12" fill="#3d2066" opacity="0.9"/>
  <!-- Chair base -->
  <rect x="291" y="375" width="8" height="60" fill="#2a1548"/>
  <ellipse cx="295" cy="435" rx="30" ry="6" fill="#2a1548"/>
  <!-- Chair wheels -->
  <circle cx="268" cy="438" r="5" fill="#1a0e30"/>
  <circle cx="322" cy="438" r="5" fill="#1a0e30"/>
  <circle cx="295" cy="442" r="5" fill="#1a0e30"/>

  <!-- Monitor -->
  <rect x="230" y="185" width="170" height="120" rx="8" fill="#1b1a2e" stroke="#c770f0" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="238" y="193" width="154" height="104" rx="4" fill="url(#screenGrad)"/>
  <!-- Code on screen -->
  <rect x="248" y="205" width="50" height="4" rx="2" fill="#c770f0" opacity="0.9"/>
  <rect x="248" y="215" width="80" height="4" rx="2" fill="#be6adf" opacity="0.6"/>
  <rect x="258" y="225" width="65" height="4" rx="2" fill="#8a49a8" opacity="0.7"/>
  <rect x="258" y="235" width="90" height="4" rx="2" fill="#c770f0" opacity="0.5"/>
  <rect x="248" y="245" width="55" height="4" rx="2" fill="#6dc98e" opacity="0.6"/>
  <rect x="258" y="255" width="75" height="4" rx="2" fill="#be6adf" opacity="0.5"/>
  <rect x="248" y="265" width="45" height="4" rx="2" fill="#c770f0" opacity="0.7"/>
  <rect x="258" y="275" width="85" height="4" rx="2" fill="#8a49a8" opacity="0.4"/>
  <!-- Cursor blink -->
  <rect x="248" y="285" width="6" height="8" fill="#c770f0" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Monitor stand -->
  <rect x="305" y="305" width="20" height="8" fill="#1b1a2e"/>
  <rect x="295" y="310" width="40" height="4" rx="2" fill="#1b1a2e" stroke="#c770f0" stroke-width="0.5"/>

  <!-- Keyboard -->
  <rect x="270" y="318" width="80" height="6" rx="2" fill="#1b1a2e" stroke="#c770f0" stroke-width="0.5"/>

  <!-- Coffee mug -->
  <rect x="195" y="290" width="22" height="22" rx="3" fill="#c770f0" opacity="0.8"/>
  <path d="M217 295 Q228 300 217 310" fill="none" stroke="#c770f0" stroke-width="1.5" opacity="0.6"/>
  <!-- Steam -->
  <path d="M202 282 Q205 272 202 262" fill="none" stroke="#be6adf" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M210 280 Q213 270 210 260" fill="none" stroke="#be6adf" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- Person - Body/Torso -->
  <path d="M275 280 Q265 300 268 340 L270 365 Q290 375 320 375 L322 340 Q325 300 315 280 Z" fill="url(#shirtGrad)"/>
  <!-- Collar detail -->
  <path d="M285 280 L295 295 L305 280" fill="none" stroke="#a050d0" stroke-width="1.5"/>

  <!-- Left arm reaching to keyboard -->
  <path d="M270 295 Q250 310 265 320 Q275 325 285 318" fill="url(#shirtGrad)" stroke="#a050d0" stroke-width="0.5"/>
  <!-- Left hand -->
  <ellipse cx="280" cy="320" rx="8" ry="5" fill="url(#skinGrad)"/>

  <!-- Right arm reaching to keyboard -->
  <path d="M318 295 Q338 310 325 320 Q315 325 305 318" fill="url(#shirtGrad)" stroke="#a050d0" stroke-width="0.5"/>
  <!-- Right hand -->
  <ellipse cx="310" cy="320" rx="8" ry="5" fill="url(#skinGrad)"/>

  <!-- Neck -->
  <rect x="288" y="265" width="14" height="18" rx="5" fill="url(#skinGrad)"/>

  <!-- Head -->
  <ellipse cx="295" cy="248" rx="28" ry="30" fill="url(#skinGrad)"/>

  <!-- Hair - long flowing -->
  <path d="M267 240 Q260 215 272 200 Q285 185 305 188 Q325 192 330 210 Q335 225 328 245 Q335 250 335 260 Q330 260 325 255 Q320 265 310 268 L310 260 Q305 250 295 248 Q285 250 280 260 L280 268 Q270 265 265 255 Q260 260 255 258 Q258 248 267 240Z" fill="url(#hairGrad)"/>
  <!-- Hair detail strands -->
  <path d="M270 225 Q275 215 280 210" fill="none" stroke="#3d2418" stroke-width="0.8" opacity="0.5"/>
  <path d="M310 215 Q315 220 318 230" fill="none" stroke="#3d2418" stroke-width="0.8" opacity="0.5"/>

  <!-- Eyes -->
  <ellipse cx="285" cy="245" rx="4" ry="4.5" fill="white"/>
  <ellipse cx="305" cy="245" rx="4" ry="4.5" fill="white"/>
  <circle cx="286" cy="245" r="2.5" fill="#2c1810"/>
  <circle cx="306" cy="245" r="2.5" fill="#2c1810"/>
  <circle cx="287" cy="244" r="1" fill="white"/>
  <circle cx="307" cy="244" r="1" fill="white"/>

  <!-- Eyebrows -->
  <path d="M279 238 Q284 235 290 237" fill="none" stroke="#2c1810" stroke-width="1.2"/>
  <path d="M300 237 Q306 235 311 238" fill="none" stroke="#2c1810" stroke-width="1.2"/>

  <!-- Nose -->
  <path d="M295 250 Q293 255 295 257" fill="none" stroke="#d4a080" stroke-width="1"/>

  <!-- Smile -->
  <path d="M288 262 Q295 268 302 262" fill="none" stroke="#c4846a" stroke-width="1.2"/>

  <!-- Earrings -->
  <circle cx="267" cy="252" r="2" fill="#c770f0" opacity="0.8"/>
  <circle cx="323" cy="252" r="2" fill="#c770f0" opacity="0.8"/>

  <!-- Plant on desk -->
  <rect x="420" y="282" width="28" height="30" rx="4" fill="#2d1950" stroke="#c770f0" stroke-width="0.5"/>
  <!-- Plant leaves -->
  <path d="M434 282 Q430 260 420 250" fill="none" stroke="url(#plantGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M434 282 Q438 255 448 248" fill="none" stroke="url(#plantGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M434 278 Q425 265 430 252" fill="none" stroke="#4a9e6e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M434 278 Q445 262 440 250" fill="none" stroke="#4a9e6e" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="420" cy="249" rx="6" ry="4" fill="#6dc98e" opacity="0.8" transform="rotate(-30 420 249)"/>
  <ellipse cx="448" cy="247" rx="6" ry="4" fill="#6dc98e" opacity="0.8" transform="rotate(25 448 247)"/>
  <ellipse cx="430" cy="251" rx="5" ry="3.5" fill="#4a9e6e" opacity="0.7" transform="rotate(-15 430 251)"/>
  <ellipse cx="440" cy="249" rx="5" ry="3.5" fill="#4a9e6e" opacity="0.7" transform="rotate(20 440 249)"/>

  <!-- Books on desk shelf -->
  <rect x="180" y="395" width="12" height="30" rx="1" fill="#c770f0" opacity="0.6"/>
  <rect x="194" y="398" width="10" height="27" rx="1" fill="#8a49a8" opacity="0.6"/>
  <rect x="206" y="393" width="14" height="32" rx="1" fill="#be6adf" opacity="0.5"/>

  <!-- Floating decorative elements -->
  <circle cx="480" cy="150" r="3" fill="#c770f0" opacity="0.4">
    <animate attributeName="cy" values="150;145;150" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="200" r="2" fill="#be6adf" opacity="0.3">
    <animate attributeName="cy" values="200;194;200" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="180" r="2.5" fill="#8a49a8" opacity="0.35">
    <animate attributeName="cy" values="180;174;180" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating code symbols -->
  <text x="500" y="130" fill="#c770f0" font-family="monospace" font-size="14" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.15;0.3" dur="4s" repeatCount="indefinite"/>
    &lt;/&gt;
  </text>
  <text x="120" y="250" fill="#be6adf" font-family="monospace" font-size="12" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.1;0.25" dur="3s" repeatCount="indefinite"/>
    { }
  </text>
  <text x="490" y="280" fill="#8a49a8" font-family="monospace" font-size="11" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.1;0.25" dur="5s" repeatCount="indefinite"/>
    =&gt;
  </text>
</svg>
