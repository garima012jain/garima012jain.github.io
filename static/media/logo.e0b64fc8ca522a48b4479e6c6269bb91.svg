<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Large G -->
  <!-- G vertical stroke -->
  <rect x="40" y="30" width="18" height="300" fill="#c770f0" transform="rotate(-8 49 180)"/>
  <!-- G top horizontal -->
  <rect x="40" y="30" width="180" height="18" fill="#c770f0" transform="rotate(-2 130 39)"/>
  <!-- G bottom horizontal -->
  <rect x="40" y="310" width="180" height="18" fill="#c770f0" transform="rotate(2 130 319)"/>
  <!-- G middle horizontal (the inward stroke) -->
  <rect x="120" y="175" width="100" height="16" fill="#c770f0"/>
  <!-- G right vertical stub (bottom half only) -->
  <rect x="202" y="175" width="16" height="153" fill="#c770f0" transform="rotate(4 210 250)"/>

  <!-- Large J -->
  <!-- J top horizontal -->
  <rect x="260" y="30" width="200" height="18" fill="#c770f0" transform="rotate(2 360 39)"/>
  <!-- J vertical stroke -->
  <rect x="380" y="30" width="18" height="290" fill="#c770f0" transform="rotate(6 389 175)"/>
  <!-- J hook bottom curve -->
  <path d="M395 310 Q390 370 340 380 Q290 385 270 340" fill="none" stroke="#c770f0" stroke-width="18" stroke-linecap="round"/>
